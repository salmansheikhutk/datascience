<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصص الأنبياء - Interactive Arabic Reader</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>قصص الأنبياء - Qasas ul-Anbiya</h1>
            <p>Interactive Arabic Reader with AI-Powered Definitions</p>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- PDF Viewer Section -->
            <div class="pdf-section">
                <div class="pdf-controls">
                    <button id="prev-page" disabled>← صفحة سابقة</button>
                    <button id="next-page">صفحة تالية →</button>
                    <input type="number" id="page-input" min="1" placeholder="رقم الصفحة...">
                    <button id="zoom-out">تصغير -</button>
                    <button id="zoom-in">تكبير +</button>
                    <span id="page-info">صفحة 1 من --</span>
                </div>
                
                <div class="pdf-container">
                    <canvas id="pdf-canvas"></canvas>
                </div>
            </div>

            <!-- Definition Panel -->
            <div class="definition-panel hidden" id="definition-panel">
                <div class="panel-header">
                    <h3>معنى الكلمة</h3>
                    <button id="close-panel">×</button>
                </div>
                <div class="panel-content" id="panel-content">
                    <p style="text-align: center; direction: rtl;">اضغط على أي كلمة عربية لرؤية معناها وتحليلها اللغوي</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
